<!DOCTYPE html>
<html lang="en">
<head>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: #D3D3D3;
    color: black;
}

/* FIXED: Moved this out of the body block so it registers properly */
#draggable-img {
    position: absolute;
    cursor: grab;
    width: 150px;
}

/* Fixed top box */
.fixed-top-box {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: #111;
    padding: 10px;
    text-align: center;
    z-index: 1000;
    border-bottom: 2px solid #FF0000;
}

/* Navigation bar directly under header */
.nav-bar {
    width: 100%;
    background-color: #222;
    padding: 12px 0;
    text-align: center;
    border-bottom: 3px solid red;
    position: fixed;
    top: 100px; /* sits directly under the fixed-top-box */
    z-index: 999;
}
.nav-bar a {
    display: inline-block;
    background-color: #000000;
    color: red;
    padding: 12px 25px;
    margin: 0 8px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    border: 2px solid #333; /* makes it look like a button */
}

.nav-bar a:hover {
    background-color: #D3D3D3;
}

.content {
    margin-top: 160px;
    padding: 20px;
}


.dropbtn {
  background-color: #000000;
  color: red;
  padding: 16px;
  font-size: 16px;
  border: none;
}

.dropdown {
  position: relative;
  display: inline-block;
  margin-bottom: 20px;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #1C1C1C;
  min-width: 160px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: red;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown-content a:hover {
    background-color: #333;
}

.dropdown:hover .dropdown-content {
    display: block;
}

.dropdown:hover .dropbtn {
    background-color: #1C1C1C;
}


h2 {
    color: red;
}
</style>
</head>

<body>


<div class="fixed-top-box">
    <h1><span style="color: red;">SDR</span> <span style="color: white;">CONSOLE SUPPORT PAGE (report a bug)</span></h1>
</div>

<div class="nav-bar">
    <a href="index.html">home</a>

    <a href="z1.0.0.1.html">1.0.0.1</a>
    <a href="z1.0.1.0.html">1.0.1.0</a>
    <a href="z1.0.1.1.html">1.0.1.1</a>
    <a href="z1.1.1.1.html">Report a Bug</a>
    <a href="z2.1.1.1.html">Hardware Support</a>
</div>


<div class="content">

<h1 style="font-size: 20px;">POWERED BY <span style="color: Blue;">LINTEK</span></h1>




<div id="v1.0.0.0">
  <h2><span style="color: black;">REPORTING A </span> <span style="color: red;">BUG</span></h2>


<div class="flex items-center min-h-screen bg-gray-50 dark:bg-gray-900">
  <div class="container mx-auto">
    <div class="max-w-md mx-auto my-10 bg-white p-5 rounded-md shadow-sm">
      <div class="text-center">
        <h1 class="my-3 text-3xl font-semibold text-gray-700 dark:text-gray-200">
          Contact <span style="color: red;">US</span>
        </h1>
        <p class="text-gray-400 dark:text-gray-400">
          Fill up the form below to send us a message.
        </p>
      </div>
      <div class="m-7">
        <form action="https://api.web3forms.com/submit" method="POST" id="form">
          <input type="hidden" name="access_key" value="901c93ad-756f-407f-94fd-86bd89f683f5" />
          <input type="hidden" name="subject" value="New Submission from Web3Forms" />
          <input type="checkbox" name="botcheck" id="" style="display: none;" />

          <div class="mb-6">
            <label for="name" class="block mb-2 text-sm text-gray-600 dark:text-gray-400">Full Name</label>
            <input type="text" name="name" id="name" placeholder="John Doe" required class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 dark:bg-gray-700 dark:text-white dark:placeholder-gray-500 dark:border-gray-600 dark:focus:ring-gray-900 dark:focus:border-gray-500" />
          </div>
          <div class="mb-6">
            <label for="email" class="block mb-2 text-sm text-gray-600 dark:text-gray-400">Email Address</label>
            <input type="email" name="email" id="email" placeholder="you@company.com" required class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 dark:bg-gray-700 dark:text-white dark:placeholder-gray-500 dark:border-gray-600 dark:focus:ring-gray-900 dark:focus:border-gray-500" />
          </div>
          <div class="mb-6">
            <label for="phone" class="text-sm text-gray-600 dark:text-gray-400">Phone Number</label>
            <input type="text" name="phone" id="phone" placeholder="+1 (555) 1234-567" required class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 dark:bg-gray-700 dark:text-white dark:placeholder-gray-500 dark:border-gray-600 dark:focus:ring-gray-900 dark:focus:border-gray-500" />
          </div>
          <div class="mb-6">
            <label for="message" class="block mb-2 text-sm text-gray-600 dark:text-gray-400">Your Message</label>

            <textarea rows="5" name="message" id="message" placeholder="Your Message" class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 dark:bg-gray-700 dark:text-white dark:placeholder-gray-500 dark:border-gray-600 dark:focus:ring-gray-900 dark:focus:border-gray-500" required></textarea>
          </div>
          <div class="mb-6">
            <button type="submit" class="w-full px-3 py-4 text-white bg-indigo-500 rounded-md focus:bg-indigo-600 focus:outline-none">
              Send Message
            </button>
          </div>
          <p class="text-base text-center text-gray-400" id="result"></p>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
